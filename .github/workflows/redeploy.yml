name: CI/CD Deploy Frontend to VPS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.IMAGE_NAME }}:latest


      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # หยุดและลบ container เก่า (ถ้ามี)
            docker stop frontend-app || true
            docker rm frontend-app || true

            # ดึง Image ล่าสุดลงมา
            docker pull ${{ vars.IMAGE_NAME }}:latest

            # รัน container ใหม่พร้อมต่อเข้า network
            docker run -d \
              --name frontend-app \
              --network my-app-network \
              -p 80:80 \
              --restart always \
              ${{ vars.IMAGE_NAME }}:latest

            # ลบ image เก่าๆ ที่ไม่ได้ใช้เพื่อประหยัดพื้นที่ VPS
            docker image prune -f


      - name: Send Notification to Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deploy Frontend Status"
          description: "Commit: ${{ github.event.head_commit.message }}"